name: Uji

on:
  push:
  pull_request:

jobs:
  uji-event:
    name: Uji event & smoke server
    runs-on: ubuntu-latest
    env:
      AGENT_ROOM_PORT: "4599"
    steps:
      - name: Ambil sumber
        uses: actions/checkout@v4

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repo ini nol dependency: package.json ada, tapi tanpa deps — tidak ada npm install.
      - name: Periksa sintaks server.mjs
        run: node --check server.mjs

      - name: Periksa sintaks dinas.mjs
        run: node --check dinas.mjs

      - name: Jalankan harness uji event (semua event + hook gambar + lanjutan + penjadwal)
        run: node uji-event.mjs --semua

      - name: Uji z-order deterministik (golden uji-zorder.golden.json)
        run: node uji-zorder.mjs

      # Bukaan ruang kadis: memastikan denahnya tetap muat di dunia yang sama
      # (tanpa lantai dua, tanpa memperlebar dunia) dan tidak menabrak perabot.
      - name: Uji bukaan ruang kadis (golden uji-sisip.golden.json)
        run: node uji-sisip.mjs

      # Seragam kantor cabang: satu mesin satu seragam, dan hubungannya dengan
      # seragam harian batik tidak saling menimpa.
      - name: Uji seragam kantor cabang
        run: node uji-seragam.mjs

      # Gerbang, bukan papan skor. Memutar ulang satu hari buku agenda
      # sungguhan (tersamar) ke frame()/handle() asli room.js dan memeriksa
      # invarian sepanjang hari: nol lemparan, nol warn event, tiap penghuni
      # digambar tepat sekali, tidak ada wadah yang bocor, MOD kembali ke
      # bawaan, dan toolCount == jumlah 'pre' (Aturan 2). 11.329 frame; terukur
      # 27 detik di mesin lengang, 60-an detik kalau mesinnya lagi rebutan.
      # Kalau runner-nya kepayahan: `node uji-ulang.mjs --laju 20` (separuh).
      # Pagu anggaran token: ambang, pagar minggu dua arah (jam mesin maju MAUPUN
      # mundur tidak boleh mematikan nota), dan lima metrik di /metrics.
      # Menyalakan server sungguhan beberapa kali, jadi agak lama.
      - name: Uji pagu anggaran token
        run: node uji-pagu.mjs

      # Pegawai tetap per proyek: nama menempel pada kursi, bukan pada sesi;
      # kursi basi disapu utuh; event ambient tidak boleh menyentuh formasi.
      - name: Uji formasi pegawai tetap
        run: node uji-pegawai.mjs

      # Tenggat bergerak: pola `pada(E, E.umur + N, fn)` yang callback-nya tidak
      # pernah jalan, plus akibat yang dijanjikan event benar-benar terjadi.
      - name: Uji tenggat event
        run: node uji-tenggat.mjs

      # Arah hadap: event tidak boleh menulis `hadap` ke orang yang bukan
      # pemerannya — harus lewat menoleh()/mendongak().
      - name: Uji arah hadap penonton
        run: node uji-arah.mjs

      # Jenis kelamin pegawai: tebakan nama, timpaan manusia yang bertahan, dan
      # aturan kepala di sprite (laki-laki tidak berjilbab, dan sebaliknya).
      - name: Uji jenis kelamin pegawai
        run: node uji-jk.mjs

      # Suara ucap: semua rupa kegagalan berujung 204, klip tidak pernah dibayar
      # dua kali, kunci tidak pernah keluar server. Memakai OpenRouter palsu di
      # localhost — tidak pernah keluar jaringan, tidak pernah butuh kunci.
      - name: Uji suara ucap & daftar nama
        run: node uji-suara.mjs


      # Gerbang nol-jaringan. Membuktikan dua janji sekaligus: nota dinas keluar
      # cuma membawa metadata (prompt tidak pernah ikut), dan tiap harness yang
      # mewarisi env pemanggil sudah menutup jalur keluarnya. Punya kontrol
      # positif, jadi hijaunya berarti sesuatu.
      - name: Uji kontrak nol-jaringan
        run: node uji-jaringan.mjs

      # Kontrak mcp-room.mjs lewat klien MCP palsu: bentuk balasan tool,
      # isError yang benar (kantor menolak != kantor mati), stdout yang wajib
      # murni JSON-RPC, dan penegakan "MCP tetap hanya-baca" lewat proksi
      # pencatat — tiap permintaan yang keluar harus GET ke rute daftar putih.
      - name: Uji kontrak MCP (klien palsu)
        run: node uji-mcp.mjs

      # Lembar telaah staf: tiap pola risiko punya contoh yang harus kena DAN
      # contoh serupa yang harus lolos, `tanda` tidak pernah membawa potongan
      # perintah, dan modulnya diam waktu diimpor (mcp-izin.mjs memakainya,
      # dan stdout proses itu kanal protokol).
      - name: Uji lembar telaah risiko
        run: node uji-telaah.mjs

      # Loket paraf: telaah risiko benar-benar sampai ke agenda dan buku
      # register, dan isi perintahnya TIDAK ikut lewat pintu baru itu.
      - name: Uji loket paraf & buku register
        run: node uji-paraf.mjs

      # Transkrip peserta rapat: isi subagent (pikiran, kalimat, token) sampai
      # ke pemiliknya, dua bentuk jalur berkas, dan yang paling penting —
      # baris yang sama di dua berkas TIDAK dihitung dua kali.
      - name: Uji transkrip peserta rapat
        run: node uji-peserta.mjs

      # Papan SKP menilai MUTU: lima sumbu perilaku dan satu nilai 0-100.
      # Buku agendanya ditulis uji itu sendiri, plus golden hari sungguhan.
      - name: Uji papan SKP mutu
        run: node uji-skp.mjs

      # Loket paraf: mcp-izin.mjs dijalankan sungguhan melawan loket tiruan,
      # plus gerbang kendali web. Tidak ada biner claude yang dipakai.
      - name: Uji loket paraf
        run: node uji-izin.mjs

      # Loop kendali ujung ke ujung dengan pemeran claude-palsu.mjs:
      # stream-json, rapat ber-agenId, dan paraf yang benar-benar sampai.
      - name: Uji loop kendali web
        run: node uji-kendali.mjs

      # Loket disposisi: antrean penuh, batal, hentikan, dan tugas yang
      # lahir tapi tidak pernah bersuara. Menunggu ambang bisu ~26 detik.
      - name: Uji loket disposisi
        run: node uji-loket.mjs

      # Pegawai honorer: hook Gemini CLI masuk lewat loket yang sama, dan
      # transkrip vendor lain tidak pernah dibaca.
      - name: Uji pegawai honorer
        run: node uji-honorer.mjs

      # Juknis paraf: satu-satunya hal yang bisa menolak otomatis di gerbang
      # manusia, jadi pagarnya diuji lebih galak daripada fiturnya.
      - name: Uji juknis paraf
        run: node uji-sop.mjs

      # Kuota loket per proyek, dan loop pemilih yang wajib KELUAR waktu
      # tidak ada kandidat yang lolos — kalau tidak, servernya membeku.
      - name: Uji kuota loket
        run: node uji-kuota.mjs

      # Catatan serah terima per proyek. Yang paling gampang hanyut di sini
      # jendela jam yang melintasi tengah malam — uji-nya menaruh satu sesi
      # di berkas agenda KEMARIN dengan sengaja.
      - name: Uji serah terima
        run: node uji-serah.mjs

      # Katalog event di EVENT-ACAK.md tidak boleh basi diam-diam terhadap
      # registri sungguhan di public/event/*.js.
      - name: Periksa keselarasan katalog event
        run: node selaras-katalog.mjs --periksa

      # Permukaan protokol yang dibaca AGEN — daftar hook, berkas uji, env,
      # nama metrik — tidak boleh hanyut dari dokumentasinya. Tidak pernah
      # menulis apa pun; cuma menggagalkan.
      - name: Periksa keselarasan dokumen vs kode
        run: node selaras-dokumen.mjs --periksa

      - name: Uji putar ulang hari sungguhan (fixture buku agenda)
        run: node uji-ulang.mjs

      # Hari yang sama, tapi diputar ke SISI SERVER: 3.154 payload hook dibangun
      # ulang dari fixture dan dikirim ke POST /event, lalu diperiksa dari luar
      # lewat /stream, /buku-induk, /ruangan, /health, dan /stream?ulang=.
      # Nol perubahan server.mjs — harness luar murni.
      - name: Uji putar ulang hari sungguhan ke sisi server
        run: node uji-ulang-server.mjs

      # Papan skor, bukan gerbang: selalu exit 0. Angka "berapa event sudah jadi
      # kode" dibaca dari sini, bukan ditulis tangan di README/DESIGN.
      - name: Papan skor katalog event (event-acak.json vs public/event/*.js)
        run: node uji-katalog.mjs

      - name: Smoke server (nyalakan, cek /health, matikan)
        shell: bash
        run: |
          node server.mjs &
          PID=$!
          sehat=0
          for i in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:${AGENT_ROOM_PORT}/health"; then
              echo
              sehat=1
              break
            fi
            sleep 0.5
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$sehat" -ne 1 ]; then
            echo "server tidak menjawab /health dalam ~10 detik" >&2
            exit 1
          fi
